[options]
admin_passwd = superadmin
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
# list_db must be True so that automated database provisioning (create_database via JSON-RPC)
# is permitted by Odoo's @check_db_management_enabled security decorator.
list_db = True
# SECURITY: restrict Odoo to only serve databases whose name starts with 'shop_'.
# This matches our generateDbName() convention (shop_{subdomain}_{shortId}).
# Prevents accidental access to system or test databases that may exist in PostgreSQL.
dbfilter = ^shop_
db_template = template0
logfile = /var/log/odoo/odoo.log
limit_time_cpu = 1200
limit_time_real = 2400

# ─── Performance: multi-worker mode ──────────────────────────────────────────
# Without this, Odoo runs as a single-threaded process that serialises every
# tenant's HTTP request behind a single GIL lock — the root cause of "Odoo
# feels slow" when multiple shops are active simultaneously.
#
# workers=4 → 4 prefork worker processes, each handling one request at a time.
# Rule of thumb: 2 × CPU cores + 1. This machine should handle 4 comfortably.
# Increase to 6-8 if you move to a 4-core VPS.
#
# max_cron_threads=1 → one dedicated cron process (email, scheduled actions).
# Keeping it at 1 prevents cron from stealing all workers under load.
#
# Memory limits: soft = warn + recycle after request, hard = OS kill.
# 512 MiB soft / 640 MiB hard are safe for a 4 GB RAM host with 4 workers
# (~2.5 GB total headroom). Raise soft to 768 MiB on an 8 GB host.
workers = 4
max_cron_threads = 1
limit_memory_soft = 536870912
limit_memory_hard = 671088640
