events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    proxy_read_timeout    2400s;
    proxy_connect_timeout 300s;
    proxy_send_timeout    2400s;
    keepalive_timeout     300;
    proxy_buffer_size         128k;
    proxy_buffers             4 256k;
    proxy_busy_buffers_size   256k;

    upstream odoo             { server odoo:8069; }
    upstream platform_command { server platform-command:3000; }
    upstream shop_portal      { server shop-portal:3001; }

    # ── Main demo entry on :80 (exposed as :8888 from host) ───────────────────
    server {
        listen 80;
        server_name _;
        client_max_body_size 200m;

        # Super Admin Panel — catches everything unless overridden below
        location / {
            proxy_pass http://platform_command;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Shop Owner Portal
        location /shop {
            proxy_pass http://shop_portal;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Odoo (proxied through nginx — hides direct :8069 from clients)
        location /odoo {
            proxy_pass http://odoo;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_hide_header X-Odoo-Uid;
            proxy_hide_header X-Frame-Options;
        }
        location /web {
            proxy_pass http://odoo;
            proxy_set_header Host $host;
            proxy_hide_header X-Odoo-Uid;
        }
        location /longpolling {
            proxy_pass http://odoo;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location ~ ^/(mail|bus|base|point_of_sale|stock|sale|account|hr|pos|purchase|barcodes|kirana_rebrand)/ {
            proxy_pass http://odoo;
            proxy_set_header Host $host;
        }
    }
}
